version: '3.8'

services:
  web:
    image: php:8.1-apache
    container_name: wmsucms_web
    environment:
      DB_HOST: db
      DB_NAME: wmsucms
      DB_USER: root
      DB_PASS: ""           # empty password
    depends_on:
      - db
    volumes:
      - ./your-web-code:/var/www/html
    restart: unless-stopped

  db:
    image: mariadb:11.0
    container_name: wmsucms_db
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: wmsucms
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
