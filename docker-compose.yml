version: '3.8'

services:
  web:
    build: .
    container_name: wmsucms_web
    environment:
      DB_HOST: wmsucms-wmsu-act.h.aivencloud.com
      DB_PORT: 20747
      DB_NAME: wmsucms
      DB_USER: avnadmin
      DB_PASS: AVNS_suifDF-uCj0_ikObk7C
    volumes:
      - ./your-web-code:/var/www/html
      - ./aiven-certs/ca.pem:/etc/ssl/aiven/ca.pem:ro
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - default
      - host

networks:
  host:
    external: true
    name: host