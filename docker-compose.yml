version: '3'

services:
  web:
    build: .
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=  # Empty password for root
      - DB_NAME=wmsucms  # The database name
    depends_on:
      - db

  db:
    image: mariadb:11.4.5
    environment:
      MYSQL_ROOT_PASSWORD: ""  # Empty password for root
      MYSQL_DATABASE: wmsucms  # Database name
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
    driver: local
