services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wmsucms_web
    env_file:
      - dbvar.env
    environment:
      DB_HOST: wmsucms-wmsu-act.h.aivencloud.com
      DB_PORT: 20747
      DB_NAME: wmsucms
      DB_USER: avnadmin
      # DB_PASS: ${DB_PASSWORD}
    volumes:
      - ./your-web-code:/var/www/html
    restart: unless-stopped
