services:
  web:
    build: .
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: ""
      DB_NAME: wmsucms
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: yourpassword
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3




volumes:
  db_data:
