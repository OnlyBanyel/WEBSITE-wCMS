services:
  web:
    build: .
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: yourpassword    # <-- match the root password below
      DB_NAME: wmsucms
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: admin123   # <-- required for initialization
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - db_data:/var/lib/mysql   # <-- persist database data

volumes:
  db_data:
