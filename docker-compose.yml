version: '3.8'

services:
  web:
    image: php:8.1-apache
    container_name: wmsucms_web
    environment:
      DB_HOST: db
      DB_NAME: wmsucms
      DB_USER: root
      DB_PASS: rootpassword123   # same as MYSQL_ROOT_PASSWORD
    depends_on:
      - db
    volumes:
      - ./your-web-code:/var/www/html
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: wmsucms_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: wmsucms
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
