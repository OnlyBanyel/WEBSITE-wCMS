version: '3'

services:
  web:
    build: .
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db  # The name of the database service
      - DB_USER=root
      - DB_PASS=   # Empty password for root
      - DB_NAME=wmsucms
    depends_on:
      - db

  db:
    image: mariadb:11.4.5
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: wmsucms
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
    driver: local
