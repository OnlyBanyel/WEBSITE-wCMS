version: '3.8'

services:
  web:
    build: .
    container_name: wmsucms_web
    env_file: 
      - dbvar.env  # Create this file in same directory
    volumes:
      - ./your-web-code:/var/www/html
      - ./aiven-certs/ca.pem:/etc/ssl/aiven/ca.pem:ro
    ports:
      - "8080:80"
    restart: unless-stopped
    network_mode: "host"