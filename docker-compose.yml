version: "3.9"

services:
  web:
    build: .
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS:
      DB_NAME: wmsucms
    depends_on:
      - db

  db:
    image: mariadb:11.4.5
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: wmsucms
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
